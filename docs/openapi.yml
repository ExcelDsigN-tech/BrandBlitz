# Generated by `pnpm --filter @brandblitz/api gen:openapi` (#143).
# DO NOT EDIT BY HAND. Re-run the generator and commit the diff.
#
# CI runs `gen:openapi:check` on every PR touching apps/api/src/routes/**
# to catch route/schema changes that weren't accompanied by a regenerated
# spec. If that check fails, run the command above and commit the result.
openapi: 3.1.0
info:
  title: BrandBlitz API
  version: 1.0.0
  description: >-
    BrandBlitz HTTP API.


    Spec is generated from zod schemas at
    `apps/api/src/routes/openapi/*.openapi.ts`

    via `pnpm --filter @brandblitz/api gen:openapi`. CI fails the build when the

    generated spec drifts from the committed `docs/openapi.yml`, so every route

    schema change must be accompanied by a regenerated spec in the same commit.
servers:
  - url: https://api.brandblitz.app
    description: Production
  - url: http://localhost:4000
    description: Local dev
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthResponse:
      allOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          properties:
            user:
              $ref: "#/components/schemas/User"
          required:
            - user
    User:
      type: object
      properties:
        id:
          type: string
          example: usr_abc123
        email:
          type: string
          format: email
        name:
          type:
            - string
            - "null"
        googleId:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - createdAt
    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
      required:
        - accessToken
        - refreshToken
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
      required:
        - error
    ChallengeToken:
      type: object
      properties:
        challengeToken:
          type: string
      required:
        - challengeToken
    Challenge:
      type: object
      properties:
        id:
          type: string
        brand_id:
          type: string
        challenge_id:
          type: string
        pool_amount_usdc:
          type: string
        status:
          type: string
          enum:
            - draft
            - pending_deposit
            - active
            - ended
            - settled
            - payout_failed
            - cancelled
            - refunded
        starts_at:
          type:
            - string
            - "null"
          format: date-time
        ends_at:
          type:
            - string
            - "null"
          format: date-time
        brand_name:
          type: string
        tagline:
          type:
            - string
            - "null"
        logo_url:
          type:
            - string
            - "null"
      required:
        - id
        - brand_id
        - challenge_id
        - pool_amount_usdc
        - status
        - starts_at
        - ends_at
        - brand_name
    ChallengeQuestion:
      type: object
      properties:
        id:
          type: string
        challenge_id:
          type: string
        round:
          type: integer
          minimum: 1
          maximum: 3
        question_type:
          type: string
        prompt_type:
          type: string
          enum:
            - text
            - brand_image
            - product_image
        question_text:
          type: string
        option_a:
          type: string
        option_b:
          type: string
        option_c:
          type: string
        option_d:
          type: string
      required:
        - id
        - challenge_id
        - round
        - question_type
        - prompt_type
        - question_text
        - option_a
        - option_b
        - option_c
        - option_d
    LeaderboardRow:
      type: object
      properties:
        rank:
          type: integer
          exclusiveMinimum: 0
        userId:
          type: string
        displayName:
          type:
            - string
            - "null"
        totalScore:
          type: integer
      required:
        - rank
        - userId
        - displayName
        - totalScore
    InviteCode:
      type: object
      properties:
        id:
          type: string
          format: uuid
        brand_id:
          type: string
          format: uuid
        challenge_id:
          type:
            - string
            - "null"
          format: uuid
        code:
          type: string
        expires_at:
          type:
            - string
            - "null"
          format: date-time
        max_uses:
          type:
            - integer
            - "null"
        use_count:
          type: integer
        created_at:
          type: string
          format: date-time
      required:
        - id
        - brand_id
        - challenge_id
        - code
        - expires_at
        - max_uses
        - use_count
        - created_at
    ChallengeComment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        challenge_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        body:
          type: string
        display_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - challenge_id
        - user_id
        - body
        - display_name
        - created_at
        - updated_at
    ChallengeDraft:
      type: object
      properties:
        id:
          type: string
          format: uuid
        brand_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - draft
            - pending_deposit
        starts_at:
          type:
            - string
            - "null"
          format: date-time
        ends_at:
          type:
            - string
            - "null"
          format: date-time
        deposit_memo:
          type:
            - string
            - "null"
        pool_amount_usdc:
          type: string
      required:
        - id
        - brand_id
        - status
        - starts_at
        - ends_at
        - deposit_memo
        - pool_amount_usdc
      additionalProperties: {}
  parameters: {}
paths:
  /auth/google/callback:
    post:
      tags:
        - auth
      summary: Exchange a Google ID token for a BrandBlitz session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                idToken:
                  type: string
                  minLength: 1
              required:
                - idToken
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid Google ID token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/me:
    get:
      tags:
        - auth
      summary: Return the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                required:
                  - user
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: User no longer exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/refresh:
    post:
      tags:
        - auth
      summary: Rotate access + refresh tokens; detects refresh-token reuse
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  minLength: 1
              required:
                - refreshToken
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Invalid or reused refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/logout:
    post:
      tags:
        - auth
      summary: Invalidate the current refresh token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  minLength: 1
      responses:
        "204":
          description: Logged out
  /sessions/{id}/warmup-start:
    post:
      tags:
        - sessions
      summary: Mark warmup as started; server records the timer baseline
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
      responses:
        "200":
          description: Warmup initialised
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                  warmupStartedAt:
                    type: string
                    format: date-time
                required:
                  - sessionId
                  - warmupStartedAt
        "401":
          description: Unauthenticated
        "404":
          description: Challenge not found
  /sessions/{id}/warmup-complete:
    post:
      tags:
        - sessions
      summary: Mark warmup as complete and return a challenge token (#151)
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Warmup complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeToken"
        "400":
          description: Warmup minimum-time not yet elapsed
          content:
            application/json:
              schema:
                type: object
                properties:
                  remainingMs:
                    type: integer
                    minimum: 0
                required:
                  - remainingMs
        "401":
          description: Unauthenticated
  /sessions/{id}/answer/{round}:
    post:
      tags:
        - sessions
      summary: Submit an answer for a specific challenge round (#154)
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
        - schema:
            type: string
            enum:
              - "1"
              - "2"
              - "3"
          required: true
          name: round
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                selectedOption:
                  type: string
                  enum:
                    - A
                    - B
                    - C
                    - D
                reactionTimeMs:
                  type: integer
                  minimum: 0
              required:
                - selectedOption
                - reactionTimeMs
      responses:
        "200":
          description: Answer recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  score:
                    type: integer
                  correct:
                    type: boolean
                required:
                  - score
                  - correct
        "400":
          description: Malformed payload
        "401":
          description: Unauthenticated
        "409":
          description: Round already submitted
  /challenges/{id}:
    get:
      tags:
        - challenges
      summary: Fetch a single challenge with its question set
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Challenge
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge:
                    $ref: "#/components/schemas/Challenge"
                  questions:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChallengeQuestion"
                required:
                  - challenge
                  - questions
        "401":
          description: Unauthenticated
        "404":
          description: Challenge not found
  /challenges:
    get:
      tags:
        - challenges
      summary: List active challenges (paginated)
      parameters:
        - schema:
            type: string
          required: false
          name: cursor
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Challenges page
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenges:
                    type: array
                    items:
                      $ref: "#/components/schemas/Challenge"
                  nextCursor:
                    type:
                      - string
                      - "null"
                required:
                  - challenges
                  - nextCursor
  /leaderboard/{challengeId}:
    get:
      tags:
        - leaderboard
      summary: Top-N leaderboard for a single challenge
      parameters:
        - schema:
            type: string
          required: true
          name: challengeId
          in: path
        - schema:
            type: integer
            minimum: 1
            maximum: 500
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Leaderboard page
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeaderboardRow"
                  generatedAt:
                    type: string
                    format: date-time
                required:
                  - rows
                  - generatedAt
  /waitlist/redeem-code:
    post:
      tags:
        - waitlist
      summary: Redeem a brand invite for priority waitlist access
      description: Requires an active account enrolled with its own email. Redemption
        is atomic, idempotent per code/user, and audit logged. Suspension is
        never cleared.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  pattern: ^[A-Za-z0-9]{32}$
              required:
                - code
      responses:
        "200":
          description: Access granted, including retries
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - active
                  brandId:
                    type: string
                    format: uuid
                  challengeId:
                    type:
                      - string
                      - "null"
                    format: uuid
                required:
                  - status
                  - brandId
                  - challengeId
        "400":
          description: Invalid code format
        "401":
          description: Authentication required
        "403":
          description: Account suspended or account email not on waitlist
        "404":
          description: Unknown or deleted-scope code
        "409":
          description: Code exhausted
        "410":
          description: Code expired
        "429":
          description: Too many attempts
  /waitlist/access:
    get:
      tags:
        - waitlist
      summary: Check the authenticated account's waitlist access
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current access
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - not_enrolled
                      - waiting
                      - active
                required:
                  - status
        "401":
          description: Authentication required
  /brands/{id}/invite-codes:
    post:
      tags:
        - brands
      summary: Generate a brand or challenge invite (brand owner only)
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                challengeId:
                  type: string
                  format: uuid
                expiresAt:
                  type: string
                  format: date-time
                maxUses:
                  type: integer
                  minimum: 1
                  maximum: 100000
      responses:
        "201":
          description: Generated code
          content:
            application/json:
              schema:
                type: object
                properties:
                  inviteCode:
                    $ref: "#/components/schemas/InviteCode"
                required:
                  - inviteCode
        "400":
          description: Invalid expiry or limit
        "403":
          description: Not the brand owner
        "404":
          description: Challenge does not belong to brand
    get:
      tags:
        - brands
      summary: View codes and usage (brand owner only)
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
        - schema:
            type: string
          required: false
          name: cursor
          in: query
      responses:
        "200":
          description: Up to 100 codes, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/InviteCode"
                  nextCursor:
                    type:
                      - string
                      - "null"
                required:
                  - data
                  - nextCursor
        "400":
          description: Invalid cursor
        "403":
          description: Not the brand owner
  /brands/{id}/retention:
    get:
      tags:
        - brands
      summary: Weekly cross-challenge cohort retention (brand viewer or higher)
      description: Monday UTC cohorts, based on first non-practice, non-flagged
        live-session participation. Later weeks count distinct users returning
        to a different challenge. Completed zero-return weeks are included;
        future weeks are omitted. Week 0 and up to 12 later weeks are returned.
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Empty cohorts when fewer than two challenges or no eligible
            participants
          content:
            application/json:
              schema:
                type: object
                properties:
                  challengeCount:
                    type: integer
                  cohorts:
                    type: array
                    items:
                      type: object
                      properties:
                        cohort_week:
                          type: string
                        cohort_size:
                          type: integer
                        week_offset:
                          type: integer
                        retained_users:
                          type: integer
                        retention_pct:
                          type: number
                      required:
                        - cohort_week
                        - cohort_size
                        - week_offset
                        - retained_users
                        - retention_pct
                required:
                  - challengeCount
                  - cohorts
        "403":
          description: Not a brand member
        "404":
          description: Brand not found
  /challenges/{id}/comments:
    get:
      tags:
        - challenges
      summary: Read a persistent challenge discussion
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
        - schema:
            type: integer
            minimum: 1
            maximum: 100
          required: false
          name: limit
          in: query
        - schema:
            type: string
          required: false
          name: cursor
          in: query
      responses:
        "200":
          description: Comments newest first (default page size 20)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChallengeComment"
                  nextCursor:
                    type:
                      - string
                      - "null"
                required:
                  - data
                  - nextCursor
        "400":
          description: Invalid pagination
        "404":
          description: Challenge missing, draft or deleted
    post:
      tags:
        - challenges
      summary: Post a plain-text challenge comment
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
              required:
                - body
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  comment:
                    $ref: "#/components/schemas/ChallengeComment"
                required:
                  - comment
        "400":
          description: Invalid body
        "403":
          description: Suspended or fraud-flagged account
        "404":
          description: Challenge missing, draft or deleted
        "422":
          description: Profanity or spam
        "429":
          description: Duplicate body or more than five comments/minute
  /challenges/{id}/duplicate:
    post:
      tags:
        - challenges
      summary: Duplicate a challenge's configuration into an unfunded draft (owner only)
      description: Copies questions, limits, payout schedule, existing licensing
        obligations, variants, tiers and tags. Dates, escrow state, sessions,
        leaderboards and experiment results are reset.
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "201":
          description: New draft
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge:
                    $ref: "#/components/schemas/ChallengeDraft"
                required:
                  - challenge
        "403":
          description: Not the owner
        "404":
          description: Source missing or deleted
  /challenges/{id}/publish-draft:
    post:
      tags:
        - challenges
      summary: Set new dates and receive fresh funding instructions for a draft
      description: Requires ownership, current terms acceptance, a future start, an
        end at least one hour later and a minimum 100 USDC pool. Changes status
        to pending_deposit. Funding uses the existing deposit flow.
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                startsAt:
                  type: string
                  format: date-time
                endsAt:
                  type: string
                  format: date-time
              required:
                - startsAt
                - endsAt
      responses:
        "200":
          description: Ready to fund
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge:
                    $ref: "#/components/schemas/ChallengeDraft"
                  depositInstructions:
                    type: object
                    properties:
                      hotWalletAddress:
                        type: string
                      memo:
                        type: string
                      amount:
                        type: string
                      asset:
                        type: string
                        enum:
                          - USDC
                    required:
                      - hotWalletAddress
                      - memo
                      - amount
                      - asset
                required:
                  - challenge
                  - depositInstructions
        "403":
          description: Not the owner or terms not accepted
        "404":
          description: Draft not found
        "409":
          description: Already scheduled
        "422":
          description: Invalid dates or pool
webhooks: {}
