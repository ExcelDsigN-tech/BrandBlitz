# Production overrides: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

secrets:
  s3_secret_access_key:
    external: true # create with: printf '<value>' | docker secret create s3_secret_access_key -
  minio_root_password:
    external: true # create with: printf '<value>' | docker secret create minio_root_password -
  hot_wallet_secret:
    external: true # create with: printf '<value>' | docker secret create hot_wallet_secret -
  jwt_secret:
    external: true # create with: printf '<value>' | docker secret create jwt_secret -
  webhook_secret:
    external: true # create with: printf '<value>' | docker secret create webhook_secret -
  nextauth_secret:
    external: true # create with: printf '<value>' | docker secret create nextauth_secret -
  google_client_secret:
    external: true # create with: printf '<value>' | docker secret create google_client_secret -

services:
  postgres:
    restart: unless-stopped
    # No exposed port in prod — only internal network access

  redis:
    restart: unless-stopped

  minio:
    restart: unless-stopped
    command: server /data --console-address ":9001" --certs-dir /certs
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_OPTS: "--certs-dir /certs"
    volumes:
      - /etc/minio/certs:/certs:ro
    secrets:
      - minio_root_password

  minio-setup:
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    depends_on:
      minio:
        condition: service_healthy

  api:
    restart: unless-stopped
    environment:
      NODE_ENV: production
      S3_ENDPOINT: ${S3_ENDPOINT:-https://minio:9000}
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
      S3_SECRET_ACCESS_KEY: ""
      # Docker secrets convention — prefer the mounted secret file over a plain env var.
      HOT_WALLET_SECRET_FILE: /run/secrets/hot_wallet_secret
      HOT_WALLET_SECRET: ""
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_SECRET: ""
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
      WEBHOOK_SECRET: ""
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      GOOGLE_CLIENT_SECRET: ""
    secrets:
      - s3_secret_access_key
      - hot_wallet_secret
      - jwt_secret
      - webhook_secret
      - google_client_secret
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512m

  worker:
    restart: unless-stopped
    environment:
      NODE_ENV: production
      S3_ENDPOINT: ${S3_ENDPOINT:-https://minio:9000}
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
      S3_SECRET_ACCESS_KEY: ""
      HOT_WALLET_SECRET_FILE: /run/secrets/hot_wallet_secret
      HOT_WALLET_SECRET: ""
    secrets:
      - s3_secret_access_key
      - hot_wallet_secret
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256m

  deposit-monitor:
    restart: unless-stopped
    environment:
      NODE_ENV: production
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
      WEBHOOK_SECRET: ""
    secrets:
      - webhook_secret
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 128m

  web:
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 256m
    environment:
      NODE_ENV: production
      NEXTAUTH_SECRET_FILE: /run/secrets/nextauth_secret
      NEXTAUTH_SECRET: ""
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      GOOGLE_CLIENT_SECRET: ""
    secrets:
      - nextauth_secret
      - google_client_secret

  nginx:
    restart: unless-stopped
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: brandblitz-nginx:${APP_VERSION:-prod}
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx/templates/nginx.prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
